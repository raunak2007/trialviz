[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trialviz"
version = "0.1.0"
description = "Query-to-visualization backend over the ClinicalTrials.gov v2 API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "anthropic>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]
deploy = [
    "modal>=1.0",
]

[tool.setuptools.packages.find]
include = ["trialviz*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
